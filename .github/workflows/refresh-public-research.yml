name: Refresh public research snapshot
on:
  workflow_dispatch:
  push:
    branches: [feature/nflverse-research-rebuild]
    paths:
      - 'scripts/build-nflverse-research.py'
      - 'scripts/validate-nflverse-research.py'
      - 'public/research/**'
      - '.github/workflows/refresh-public-research.yml'
      - 'tests/unit/public-research-static.test.ts'
  schedule:
    - cron: '0 12 * * 4'

permissions:
  contents: write

concurrency:
  group: research-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install direct nflverse reader
        run: pip install 'nflreadpy>=0.1.2,<0.3'
      - name: Build snapshots with no server/database dependency
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            month="$(date -u +%m)"
            if (( 10#$month < 9 )); then
              echo "Offseason: nothing to refresh."
              exit 0
            fi
            python scripts/build-nflverse-research.py --seasons "$(date -u +%Y)"
            python scripts/validate-nflverse-research.py "$(date -u +%Y)"
          else
            python scripts/build-nflverse-research.py --seasons 2023 2024 2025 2026
            python scripts/validate-nflverse-research.py
          fi
      - name: Install and verify application
        run: |
          npm ci
          node --check public/research/app.js
          npm run typecheck
          npx vitest run tests/unit/public-research-static.test.ts
      - name: Browser-test desktop and mobile research pages
        if: github.event_name != 'schedule'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/public-research-history.spec.ts
      - name: Commit only if validated snapshots changed
        shell: bash
        run: |
          git config user.name "leaguezone-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/research/data/
          if ! git diff --staged --quiet; then
            git commit -m "Refresh validated nflverse research snapshots [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase FETCH_HEAD
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "Research data unchanged; no Vercel deployment."
          fi
