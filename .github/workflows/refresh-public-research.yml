name: Refresh public research in R2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-public-research.yml'
      - 'scripts/build-nflverse-research.py'
      - 'scripts/build-research-usage.py'
      - 'scripts/build-research-redzone.py'
      - 'scripts/publish-public-research-r2.py'
      - 'scripts/validate-research-usage.py'
      - 'scripts/validate-research-redzone.py'
  schedule:
    - cron: '0 12 * 1,9-12 4'

permissions:
  contents: read

concurrency:
  group: research-r2-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install data loaders and R2 S3 client
        run: pip install 'nflreadpy>=0.1.2,<0.3' 'boto3>=1.34,<2' 'polars>=1,<2'
      - name: Rebuild and validate research data offline
        shell: bash
        run: |
          season="$(python -c 'from datetime import datetime,timezone; now=datetime.now(timezone.utc); print(now.year if now.month >= 9 else now.year - 1)')"
          python scripts/build-nflverse-research.py --seasons "$season"
          python scripts/build-research-usage.py --seasons "$season"
          python scripts/build-research-redzone.py --seasons "$season"
          python scripts/validate-nflverse-research.py
          python scripts/validate-research-usage.py
          python scripts/validate-research-redzone.py
          python -m unittest discover -s tests/research_r2 -p 'test_*.py' -v
          python scripts/publish-public-research-r2.py --dry-run
      - name: Typecheck, source isolation and unit tests
        run: |
          npm ci
          node --check public/research/app.js
          npm run typecheck
          npx vitest run tests/unit/public-research-static.test.ts
      - name: Publish validated snapshots to R2 without Git commits
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        env:
          RESEARCH_R2_ACCOUNT_ID: ${{ secrets.RESEARCH_R2_ACCOUNT_ID }}
          RESEARCH_R2_ACCESS_KEY_ID: ${{ secrets.RESEARCH_R2_ACCESS_KEY_ID }}
          RESEARCH_R2_SECRET_ACCESS_KEY: ${{ secrets.RESEARCH_R2_SECRET_ACCESS_KEY }}
          RESEARCH_R2_BUCKET: ${{ vars.RESEARCH_R2_BUCKET }}
          RESEARCH_R2_PUBLIC_BASE: ${{ vars.RESEARCH_R2_PUBLIC_BASE }}
          RESEARCH_R2_SITE_ORIGIN: https://www.leaguezonehq.com
          # Browser access independently confirmed; GitHub's runner IP got a
          # Cloudflare edge 403. Still verify every uploaded R2 file via S3 GET.
          RESEARCH_R2_ALLOW_CLOUDFLARE_403: "true"
        run: python scripts/publish-public-research-r2.py
