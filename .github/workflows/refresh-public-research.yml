name: Refresh public research snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild static NFL statistics
        run: node scripts/refresh-public-research.mjs
      - name: Commit snapshot only if it changed
        run: |
          git config user.name "leaguezone-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/research/data/
          if ! git diff --staged --quiet; then
            git commit -m "Refresh static LeagueZone research data"
            git push
          fi
