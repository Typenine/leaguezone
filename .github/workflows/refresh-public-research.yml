name: Refresh public research in R2
on:
  workflow_dispatch:
  push:
    branches: [feature/research-r2-uploads]
    paths:
      - 'scripts/build-nflverse-research.py'
      - 'scripts/publish-public-research-r2.py'
      - 'scripts/validate-nflverse-research.py'
      - 'public/research/**'
      - '.github/workflows/refresh-public-research.yml'
      - 'tests/unit/public-research-static.test.ts'
      - 'tests/e2e/public-research-history.spec.ts'
  schedule:
    - cron: '0 12 * 1,9-12 4'

permissions:
  contents: read

concurrency:
  group: research-r2-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install data loaders and R2 S3 client
        run: pip install 'nflreadpy>=0.1.2,<0.3' 'boto3>=1.34,<2'
      - name: Rebuild and validate research data offline
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            mapfile -t years < <(find public/research/data -maxdepth 1 -name '20??.json' -printf '%f\n' | sed 's/\.json$//' | sort -n)
            python scripts/build-nflverse-research.py --seasons "${years[@]}"
          else
            python scripts/build-nflverse-research.py
          fi
          python scripts/validate-nflverse-research.py
          python -m unittest discover -s tests/research_r2 -p 'test_*.py' -v
          python scripts/publish-public-research-r2.py --dry-run
      - name: Typecheck, source isolation and unit tests
        run: |
          npm ci
          node --check public/research/app.js
          npm run typecheck
          npx vitest run tests/unit/public-research-static.test.ts
      - name: Desktop and mobile research browser tests
        if: github.event_name == 'push'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/public-research-history.spec.ts
      - name: Publish validated snapshots to R2 without Git commits
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        env:
          RESEARCH_R2_ACCOUNT_ID: ${{ secrets.RESEARCH_R2_ACCOUNT_ID }}
          RESEARCH_R2_ACCESS_KEY_ID: ${{ secrets.RESEARCH_R2_ACCESS_KEY_ID }}
          RESEARCH_R2_SECRET_ACCESS_KEY: ${{ secrets.RESEARCH_R2_SECRET_ACCESS_KEY }}
          RESEARCH_R2_BUCKET: ${{ vars.RESEARCH_R2_BUCKET }}
          RESEARCH_R2_PUBLIC_BASE: ${{ vars.RESEARCH_R2_PUBLIC_BASE }}
          RESEARCH_R2_SITE_ORIGIN: https://www.leaguezonehq.com
        run: python scripts/publish-public-research-r2.py
