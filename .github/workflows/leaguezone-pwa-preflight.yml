name: LeagueZone app install preflight

on:
  push:
    branches: [feature/leaguezone-installable-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript validation
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit regressions
        run: npm test
        env:
          NODE_ENV: test
      - name: Build app without database migrations
        run: npx next build
        env:
          SKIP_MIGRATION: 'true'
          E2E_TEST_MODE: 'true'
          DATABASE_URL: 'postgresql://ci:ci@localhost/ci'
          AUTH_SECRET: 'ci-auth-secret-placeholder-12345'
          NEXTAUTH_SECRET: 'ci-secret-placeholder'
          ADMIN_PASSWORD_HASH: 'ci-placeholder'
          KV_REST_API_URL: 'https://ci.kv.vercel.app'
          KV_REST_API_TOKEN: 'ci-token'
      - run: npx playwright install --with-deps chromium
      - name: Start local production server
        run: |
          npm start > /tmp/leaguezone-pwa-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:3000/install >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:3000/install >/dev/null
        env:
          E2E_TEST_MODE: 'true'
          DATABASE_URL: 'postgresql://ci:ci@localhost/ci'
          AUTH_SECRET: 'ci-auth-secret-placeholder-12345'
          NEXTAUTH_SECRET: 'ci-secret-placeholder'
          ADMIN_PASSWORD_HASH: 'ci-placeholder'
          KV_REST_API_URL: 'https://ci.kv.vercel.app'
          KV_REST_API_TOKEN: 'ci-token'
      - name: Desktop Chrome and Pixel 7 app smoke tests
        run: npx playwright test tests/e2e/leaguezone-pwa.spec.ts tests/e2e/public-pages.spec.ts
        env:
          TEST_BASE_URL: 'http://localhost:3000'
          DATABASE_URL: ''
