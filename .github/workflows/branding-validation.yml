name: Branding branch validation

on:
  push:
    branches: [fix/branding-contrast-and-team-colors]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
        env:
          NODE_ENV: test
      - name: Production build without migration
        run: npx next build
        env:
          SKIP_MIGRATION: 'true'
          DATABASE_URL: 'postgresql://ci:ci@localhost/ci'
          NEXTAUTH_SECRET: 'ci-secret-placeholder'
          ADMIN_PASSWORD_HASH: 'ci-placeholder'
          KV_REST_API_URL: 'https://ci.kv.vercel.app'
          KV_REST_API_TOKEN: 'ci-token'
