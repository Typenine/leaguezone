name: Finalize branding settings

on:
  push:
    branches: [fix/branding-contrast-and-team-colors]
    paths:
      - .github/workflows/branding-finalize-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/branding-contrast-and-team-colors
      - name: Patch branding settings UI
        run: python scripts/branding-settings-finalize.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/settings/SettingsContent.tsx'
          git commit -m "Finish live branding settings controls"
          git push origin HEAD:fix/branding-contrast-and-team-colors
